# Every push and pull request: the same checks on real macOS, Windows and Linux machines.
# A pull request is merged only when all three are green (see CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download Electron
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs. Lurk keeps its sandbox
      # on, so the runner allows them instead of starting Electron with --no-sandbox.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tour
        if: runner.os != 'Linux'
        run: npx playwright test
      - name: Tour (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - name: Tour screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tour-${{ runner.os }}
          path: |
            tour/out/
            test-results/
          if-no-files-found: ignore

      - name: Package (unsigned)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lurk-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          retention-days: 14
